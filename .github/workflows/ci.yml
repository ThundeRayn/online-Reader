name: CI - Lint, Build & Merge to Main

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:

  # ──────────────────────────────────────────────
  # JOB 1: Lint and Build
  # ──────────────────────────────────────────────
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

  # ──────────────────────────────────────────────
  # JOB 2: Merge to Main (only if JOB 1 passes)
  # Vercel auto-deploys from main
  # ──────────────────────────────────────────────
  merge-to-main:
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge master into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          git checkout main

          git merge origin/master --no-ff -m "ci: auto-merge master into main"

          git push origin main
